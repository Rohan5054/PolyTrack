[project]
name = "polytrack-agent"
version = "0.1.0"
description = "RL + trajectory-search agent for PolyTrack"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "gymnasium>=1.0", "wasmtime>=20.0"]

# Training only. The physics backend, the search layer and the acceptance gate
# all run without it, and tests/test_learning.py skips cleanly when it is absent.
#   pip install -e .[learning]
# CPU is the right build: the bottleneck is the simulator at ~11 transitions a
# second per collector, not a 62-float MLP.
[project.optional-dependencies]
learning = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["polytrack*"]
